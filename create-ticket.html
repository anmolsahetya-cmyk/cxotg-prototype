<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b87e6">
  <link rel="icon" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Pearl CX — New Ticket</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .ct-section-title {
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: var(--sp-3);
    }
    .ct-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      height: 48px;
      padding: 0 var(--sp-3);
      border: 1.5px solid transparent;
      border-radius: var(--radius-lg);
      cursor: pointer;
      font-size: var(--text-base);
      color: var(--text);
      background: var(--bg-selection);
      transition: background 150ms;
    }
    .ct-picker:active { background: var(--bg-card); border-color: var(--border); }
    .ct-picker-row {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
    }
    .ct-picker-row:last-child { border-bottom: none; }
    .ct-picker-row:active { background: var(--bg-selection); }
    .ct-picker-label { font-size: var(--text-base); color: var(--text); }
    .ct-picker-check { color: var(--accent); margin-left: auto; display: flex; }
  </style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/components.js"></script>
<script>

/* ============================================================
   Form state
   ============================================================ */
function _todayISO() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function _formatDateLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

const CT = {
  email: '',
  customerName: '',
  phone: '',
  segmentId: (DATA.segments.find(s => s.name === DATA.currentSegment) || {}).id ?? null,
  dateISO: _todayISO(),
  priorityId: 0,   // Low (default)
  statusId:   0,   // New (default)
  ownerId:    null,
  description: '',
};

/* Email-first identity resolution — see CONTEXT.md "New Ticket flow" */
const LOOKUP = {
  status: 'idle',   // idle | invalid | checking | found | notfound | error
  matched: null,
  checkedEmail: '',
  requestId: 0,
};

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function isValidEmail(v) { return EMAIL_RE.test(v.trim()); }
function emailLocalPart(v) { return (v.split('@')[0] || '').trim(); }

function _esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function _chevronIcon() {
  return `<span style="color:var(--text-light);display:flex;flex-shrink:0;">${renderIcon('chevron_down', 18)}</span>`;
}

/* ============================================================
   Name / Phone — reactive to lookup state
   ============================================================ */
function _nameFieldHTML() {
  const disabled = LOOKUP.status === 'idle' || LOOKUP.status === 'invalid' ||
                    LOOKUP.status === 'checking' || LOOKUP.status === 'found';
  let value = '';
  let placeholder = 'Enter email to continue';
  if (LOOKUP.status === 'checking') {
    placeholder = 'Checking…';
  } else if (LOOKUP.status === 'found') {
    value = CT.customerName;
  } else if (LOOKUP.status === 'notfound' || LOOKUP.status === 'error') {
    value = CT.customerName;
    placeholder = 'Customer name';
  }
  const hint = LOOKUP.status === 'found'
    ? `<div class="field-hint">Matched to an existing customer</div>` : '';

  return `
    <div class="input-group" id="ct-name-wrap">
      <label class="input-label" for="ct-name">Customer name</label>
      <input type="text" id="ct-name" class="input-field" value="${_esc(value)}" placeholder="${placeholder}"
        ${disabled ? 'disabled' : ''} oninput="CT.customerName=this.value">
      ${hint}
    </div>
  `;
}

function _phoneFieldHTML() {
  const lockedWithPhone = LOOKUP.status === 'found' && !!(LOOKUP.matched && LOOKUP.matched.phone);
  const disabled = LOOKUP.status === 'checking' || lockedWithPhone;
  const value = lockedWithPhone ? LOOKUP.matched.phone : CT.phone;
  const placeholder = LOOKUP.status === 'checking' ? 'Checking…' : 'Phone number';

  return `
    <div class="input-group" id="ct-phone-wrap" style="margin-bottom:0;">
      <label class="input-label" for="ct-phone">Phone number</label>
      <input type="tel" id="ct-phone" class="input-field" value="${_esc(value)}" placeholder="${placeholder}"
        ${disabled ? 'disabled' : ''} oninput="CT.phone=this.value">
    </div>
  `;
}

function _refreshNamePhone() {
  const nameEl = document.getElementById('ct-name-wrap');
  const phoneEl = document.getElementById('ct-phone-wrap');
  if (nameEl) nameEl.outerHTML = _nameFieldHTML();
  if (phoneEl) phoneEl.outerHTML = _phoneFieldHTML();
}

/* ============================================================
   Email input — triggers the lookup on blur
   ============================================================ */
window.onEmailInput = function(v) {
  CT.email = v;
  document.getElementById('ct-email').classList.remove('field-invalid');
  document.getElementById('ct-email-msg').innerHTML = '';

  // Editing the email again after it was already resolved invalidates
  // whatever Name/Phone state that resolution produced.
  if (v.trim() !== LOOKUP.checkedEmail && LOOKUP.status !== 'idle' && LOOKUP.status !== 'checking') {
    LOOKUP.status = 'idle';
    LOOKUP.matched = null;
    CT.customerName = '';
    CT.phone = '';
    document.getElementById('ct-email-icon').innerHTML = '';
    _refreshNamePhone();
    _refreshSubmit();
  }
};

window.onEmailBlur = function(v) {
  v = v.trim();
  CT.email = v;
  const emailEl = document.getElementById('ct-email');
  const msgEl = document.getElementById('ct-email-msg');
  const iconEl = document.getElementById('ct-email-icon');

  if (v === '') {
    LOOKUP.status = 'idle';
    LOOKUP.matched = null;
    LOOKUP.checkedEmail = '';
    CT.customerName = '';
    CT.phone = '';
    emailEl.classList.remove('field-invalid');
    msgEl.innerHTML = '';
    iconEl.innerHTML = '';
    _refreshNamePhone();
    _refreshSubmit();
    return;
  }

  if (!isValidEmail(v)) {
    LOOKUP.status = 'invalid';
    LOOKUP.matched = null;
    emailEl.classList.add('field-invalid');
    msgEl.innerHTML = `<div class="field-error">Enter a valid email address</div>`;
    _refreshNamePhone();
    _refreshSubmit();
    return;
  }

  emailEl.classList.remove('field-invalid');

  // Already resolved this exact email — don't re-fire on a plain refocus/blur.
  if (v === LOOKUP.checkedEmail && (LOOKUP.status === 'found' || LOOKUP.status === 'notfound')) {
    return;
  }

  const reqId = ++LOOKUP.requestId;
  LOOKUP.status = 'checking';
  msgEl.innerHTML = '';
  iconEl.innerHTML = '<span class="field-spinner"></span>';
  _refreshNamePhone();
  _refreshSubmit();

  mockLookupCustomerByEmail(v).then(match => {
    if (reqId !== LOOKUP.requestId) return; // stale — email changed again mid-flight
    LOOKUP.checkedEmail = v;
    iconEl.innerHTML = '';
    if (match) {
      LOOKUP.status = 'found';
      LOOKUP.matched = match;
      CT.customerName = match.name || emailLocalPart(v);
      CT.phone = match.phone || '';
    } else {
      LOOKUP.status = 'notfound';
      LOOKUP.matched = null;
      CT.customerName = '';
      CT.phone = '';
    }
    _refreshNamePhone();
    _refreshSubmit();
  }).catch(() => {
    if (reqId !== LOOKUP.requestId) return;
    LOOKUP.status = 'error';
    LOOKUP.matched = null;
    CT.customerName = '';
    CT.phone = '';
    iconEl.innerHTML = '';
    msgEl.innerHTML = `<div class="field-warning">Couldn't verify this email — you can continue manually</div>`;
    _refreshNamePhone();
    _refreshSubmit();
  });
};

/* ============================================================
   Priority / Status — inline chips
   ============================================================ */
const PRIORITY_BORDER_VAR = {
  0: '--priority-low-border', 1: '--priority-medium-border',
  2: '--priority-high-border', 3: '--priority-critical-border',
};
const STATUS_BORDER_VAR = {
  0: '--status-new-border', 1: '--status-open-border',
  2: '--status-escalated-border', 3: '--status-resolved-border',
};

/* fill/stroke="currentColor" so the icon tracks the pill's own color rule
   (neutral at rest, --pill-c once selected) with no extra state to manage. */
function _priorityFlagIcon(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;">
    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
    <line x1="4" y1="22" x2="4" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}
function _statusDotIcon(size, hollow) {
  // "New" has no fill color in the design system — white circle, grey ring —
  // rather than a solid dot like the other statuses.
  if (hollow) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="flex-shrink:0;">
      <circle cx="12" cy="12" r="9" fill="var(--bg-card)" stroke="currentColor" stroke-width="2.5"/>
    </svg>`;
  }
  return `<span style="width:${size}px;height:${size}px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0;"></span>`;
}

function _pillCheckIcon() {
  return `<span class="pill-check">${renderIcon('check', 13)}</span>`;
}

function _priorityChipsHTML() {
  return Object.entries(DATA.priorityMap).map(([id, p]) => {
    const sel = CT.priorityId === Number(id);
    return `<div class="pill-select${sel ? ' pill-active' : ''}" style="--pill-c:var(${PRIORITY_BORDER_VAR[id]});" onclick="setPriority(${id})">${_priorityFlagIcon(14)}<span>${p.label}</span>${_pillCheckIcon()}</div>`;
  }).join('');
}
function _statusChipsHTML() {
  return Object.entries(DATA.statusMap).map(([id, s]) => {
    const sel = CT.statusId === Number(id);
    return `<div class="pill-select${sel ? ' pill-active' : ''}" style="--pill-c:var(${STATUS_BORDER_VAR[id]});" onclick="setStatus(${id})">${_statusDotIcon(10, Number(id) === 0)}<span>${s.label}</span>${_pillCheckIcon()}</div>`;
  }).join('');
}
window.setPriority = function(id) {
  CT.priorityId = Number(id);
  document.getElementById('ct-pri-chips').innerHTML = _priorityChipsHTML();
};
window.setStatus = function(id) {
  CT.statusId = Number(id);
  document.getElementById('ct-sta-chips').innerHTML = _statusChipsHTML();
};

/* ============================================================
   Segment picker (shared sheet)
   ============================================================ */
window.openSegPicker = function() {
  const seg = CT.segmentId != null ? DATA.segments.find(s => s.id === CT.segmentId) : null;
  openSegmentSheet(seg ? seg.name : '', (id, name) => {
    CT.segmentId = id;
    const el = document.getElementById('ct-seg-text');
    el.textContent = name;
    el.style.color = 'var(--text)';
  });
};

/* ============================================================
   Ticket owner picker
   ============================================================ */
window.openOwnerPicker = function() {
  const rows = DATA.managers.map(m => {
    const sel = CT.ownerId === m.id;
    return `<div class="ct-picker-row" onclick="pickOwner(${m.id})">
      ${renderAvatar(m.name, m.avatarColor, 'sm')}
      <div class="ct-picker-label">${m.name}</div>
      ${sel ? `<span class="ct-picker-check">${renderIcon('check', 20)}</span>` : ''}
    </div>`;
  }).join('');
  openSheet('owner', rows, 'Ticket owner');
};
window.pickOwner = function(id) {
  CT.ownerId = id;
  closeSheet('owner');
  const m = getManager(id);
  const el = document.getElementById('ct-own-text');
  el.textContent = m.name;
  el.style.color = 'var(--text)';
};

/* ============================================================
   Date picker — tap-to-trigger, not a raw native <input type="date">.
   That element is DOM-only and has no React Native equivalent; the RN
   build uses @react-native-community/datetimepicker instead, which is
   imperatively triggered the same way (Android opens its own dialog,
   iOS shows an inline wheel we host in this same sheet). See CONTEXT.md.
   ============================================================ */
window.openDatePicker = function() {
  const body = `
    <div style="padding:var(--sp-4);">
      <input type="date" id="ct-date-input" class="input-field" value="${CT.dateISO}" max="${_todayISO()}">
    </div>
    <div class="sheet-footer">
      <button class="btn btn-primary btn-full" onclick="applyDatePicker()">Apply</button>
    </div>
  `;
  openSheet('date', body, 'Date');
};
window.applyDatePicker = function() {
  const v = document.getElementById('ct-date-input').value;
  if (v) {
    CT.dateISO = v;
    document.getElementById('ct-date-text').textContent = _formatDateLabel(v);
  }
  closeSheet('date');
};

/* ============================================================
   Submit
   ============================================================ */
function _canSubmit() {
  return isValidEmail(CT.email) && CT.description.trim().length > 0 && LOOKUP.status !== 'checking';
}
window._refreshSubmit = function() {
  const btn = document.getElementById('ct-submit');
  if (!btn) return;
  const ok = _canSubmit();
  btn.disabled = !ok;
  btn.classList.toggle('btn-disabled', !ok);
};

window.handleCreateTicket = function() {
  if (!_canSubmit()) return;
  showSpinner('Creating ticket…');
  setTimeout(() => {
    hideSpinner();
    showToast('Ticket created successfully!', 'success');
    setTimeout(() => { window.location.href = 'ticket-list.html'; }, 1600);
  }, 1200);
};

/* ============================================================
   Main form
   ============================================================ */
function renderCreateTicket() {
  const seg = CT.segmentId != null ? DATA.segments.find(s => s.id === CT.segmentId) : null;
  const own = CT.ownerId != null ? DATA.managers.find(m => m.id === CT.ownerId) : null;

  return `
    <div class="screen-content">
      ${renderHeader({ title: 'New ticket', showBack: true })}
      <div class="screen-body" id="ct-scroll">

        <div class="card" style="padding:16px;">
          <div class="ct-section-title">Contact information</div>

          <div class="input-group">
            <label class="input-label" for="ct-email">Email</label>
            <div class="input-field-wrap">
              <input type="email" id="ct-email" class="input-field" value="${_esc(CT.email)}"
                placeholder="name@company.com" autocomplete="email"
                oninput="onEmailInput(this.value)" onblur="onEmailBlur(this.value)">
              <span class="input-field-icon" id="ct-email-icon"></span>
            </div>
            <div id="ct-email-msg"></div>
          </div>

          ${_nameFieldHTML()}
          ${_phoneFieldHTML()}
        </div>

        <div class="card" style="padding:16px;">
          <div class="ct-section-title">Ticket details</div>

          <div class="input-group">
            <label class="input-label">Date</label>
            <div class="ct-picker" onclick="openDatePicker()">
              <span id="ct-date-text">${_formatDateLabel(CT.dateISO)}</span>
              ${_chevronIcon()}
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">Segment</label>
            <div class="ct-picker" onclick="openSegPicker()">
              <span id="ct-seg-text" style="color:${seg ? 'var(--text)' : 'var(--text-light)'};">${seg ? seg.name : 'Select segment'}</span>
              ${_chevronIcon()}
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">Priority</label>
            <div class="chip-wrap" style="padding:0;" id="ct-pri-chips">${_priorityChipsHTML()}</div>
          </div>

          <div class="input-group">
            <label class="input-label">Status</label>
            <div class="chip-wrap" style="padding:0;" id="ct-sta-chips">${_statusChipsHTML()}</div>
          </div>

          <div class="input-group">
            <label class="input-label">Ticket owner</label>
            <div class="ct-picker" onclick="openOwnerPicker()">
              <span id="ct-own-text" style="color:${own ? 'var(--text)' : 'var(--text-light)'};">${own ? own.name : 'Select ticket owner'}</span>
              ${_chevronIcon()}
            </div>
          </div>

          <div class="input-group" style="margin-bottom:0;">
            <label class="input-label" for="ct-desc">Description</label>
            <textarea id="ct-desc" class="input-field" placeholder="Describe the issue…"
              oninput="CT.description=this.value; _refreshSubmit();">${_esc(CT.description)}</textarea>
          </div>
        </div>

        <div style="padding:4px 16px 24px;">
          <button id="ct-submit" class="btn btn-primary btn-full btn-disabled" disabled onclick="handleCreateTicket()">
            Create new ticket
          </button>
        </div>

      </div>
    </div>
  `;
}

/* ============================================================
   Init
   ============================================================ */
document.body.innerHTML = renderPhoneShell(renderCreateTicket());

</script>
</body>
</html>
