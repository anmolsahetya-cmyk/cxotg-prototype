<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pearl CX — Notifications</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .notif-item {
      display:flex;align-items:flex-start;gap:var(--sp-3);
      padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--divider);
      border-left:3px solid transparent;
      cursor:pointer;transition:background 100ms,border-color 100ms;background:var(--bg-card);
    }
    .notif-item.unread { border-left-color:var(--accent); }
    .notif-item:active { background:var(--bg-selection); }
    .notif-icon-wrap {
      width:26px;height:26px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
    }
    .notif-icon-wrap.escalated { border:2px solid var(--status-escalated-border); }
    .notif-status-dot { width:8px;height:8px;border-radius:50%; }
    .notif-content { flex:1;min-width:0; }
    .notif-title { font-size:var(--text-sm);font-weight:700;color:var(--text);line-height:1.35; }
    .notif-title.you { color:var(--accent); }
    .notif-pill-row { margin-top:var(--sp-1); }
    .notif-pill-row .status-pill,
    .notif-pill-row .priority-pill { background:transparent; }
    .notif-time  { font-size:var(--text-xs);color:var(--text-light);margin-top:var(--sp-1); }
    .unread-indicator { width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px; }
  </style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/components.js"></script>
<script>

let notifications = JSON.parse(JSON.stringify(DATA.notifications));

function _actorAvatarColor(actor) {
  const m = getManagerByName(actor);
  return m ? m.avatarColor : '#CC6677';
}

function _isAssignedToYou(n) {
  const me = getManagerByEmail(DATA.user.email);
  return !!me && n.assigneeId === me.id;
}

function _notifIconWrapHTML(n) {
  if (n.type === 'comment' || n.type === 'assign') {
    return `<div class="notif-icon-wrap">${renderAvatar(n.actor, _actorAvatarColor(n.actor), 'sm')}</div>`;
  }
  if (n.type === 'status') {
    const s = DATA.statusMap[n.statusId];
    const escalated = n.statusId === 2;
    return `
      <div class="notif-icon-wrap${escalated ? ' escalated' : ''}" style="background:var(--${s.cssClass}-fill);">
        <div class="notif-status-dot" style="background:var(--${s.cssClass}-border);"></div>
      </div>
    `;
  }
  // priority
  const p = DATA.priorityMap[n.priorityId];
  return `<div class="notif-icon-wrap" style="background:var(--${p.cssClass}-fill);color:var(--${p.cssClass}-border);">${renderIcon('flag', 14)}</div>`;
}

function _notifBodyHTML(n) {
  if (n.type === 'status') {
    const s = DATA.statusMap[n.statusId];
    return `
      <div class="notif-title">${n.actor} changed status on ${n.ticketId}</div>
      <div class="notif-pill-row"><span class="status-pill ${s.cssClass}">${s.label}</span></div>
    `;
  }
  if (n.type === 'priority') {
    const p = DATA.priorityMap[n.priorityId];
    return `
      <div class="notif-title">${n.actor} changed priority on ${n.ticketId}</div>
      <div class="notif-pill-row"><span class="priority-pill ${p.cssClass}">${p.label}</span></div>
    `;
  }
  if (n.type === 'assign') {
    const assignee = getManager(n.assigneeId);
    const isYou = _isAssignedToYou(n);
    return `<div class="notif-title${isYou ? ' you' : ''}">${n.actor} assigned ${n.ticketId} to ${isYou ? 'you' : assignee.name}</div>`;
  }
  return `<div class="notif-title">${n.actor} commented on ${n.ticketId}</div>`;
}

function renderNotifications() {
  const unreadCount = notifications.filter(n => !n.read).length;
  return `
    <div class="screen-content">
      ${renderHeader({
        title: unreadCount > 0 ? `Notifications (${unreadCount})` : 'Notifications',
        showBack: true,
        right: unreadCount > 0 ? `<button class="icon-btn" onclick="markAllRead()" style="font-size:11px;color:var(--accent);font-weight:600;width:auto;padding:0 4px;">All read</button>` : ''
      })}
      <div class="screen-body">
        ${notifications.map((n, i) => `
          <div class="notif-item${n.read ? '' : ' unread'}" onclick="openNotification(${i})">
            ${_notifIconWrapHTML(n)}
            <div class="notif-content">
              ${_notifBodyHTML(n)}
              <div class="notif-time">${n.time}</div>
            </div>
            ${!n.read ? '<div class="unread-indicator"></div>' : ''}
          </div>
        `).join('')}
        ${notifications.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-icon">🔔</div>
            <div class="empty-state-text">No notifications</div>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

window.openNotification = function(idx) {
  notifications[idx].read = true;
  localStorage.setItem('selectedTicketId', notifications[idx].ticketId);
  window.location.href = 'ticket-detail.html';
};

window.markAllRead = function() {
  notifications.forEach(n => n.read = true);
  document.body.innerHTML = renderPhoneShell(renderNotifications());
  showToast('All notifications marked as read', 'success');
};

document.body.innerHTML = renderPhoneShell(renderNotifications());
</script>
</body>
</html>
