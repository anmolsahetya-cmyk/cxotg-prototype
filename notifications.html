<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b87e6">
  <link rel="icon" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Pearl CX — Notifications</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .notif-item {
      display:flex;align-items:flex-start;gap:12px;
      padding:12px 16px;border-bottom:1px solid var(--divider);
      cursor:pointer;transition:background 100ms;background:#fff;
    }
    .notif-item.unread { background:#f0f7ff; }
    .notif-item:active { background:var(--bg-selection); }
    .notif-icon-wrap {
      width:40px;height:40px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:18px;flex-shrink:0;
    }
    .notif-content { flex:1;min-width:0; }
    .notif-title { font-size:var(--text-sm);font-weight:700;color:var(--text); }
    .notif-body  { font-size:var(--text-xs);color:var(--text-light);margin-top:2px;line-height:1.4; }
    .notif-time  { font-size:10px;color:var(--text-light);margin-top:4px; }
    .unread-indicator { width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px; }
  </style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/components.js"></script>
<script>

let notifications = JSON.parse(JSON.stringify(DATA.notifications));

const NOTIF_ICONS = {
  alert:      { icon:'⚠️', bg:'#fff3e0' },
  escalation: { icon:'🔴', bg:'#ffe5eb' },
  comment:    { icon:'💬', bg:'#e8f5e9' },
  resolved:   { icon:'✅', bg:'#e8f5e9' },
  response:   { icon:'📊', bg:'#e3f2fd' },
};

function renderNotifications() {
  const unreadCount = notifications.filter(n => !n.read).length;
  return `
    <div class="screen-content">
      ${renderHeader({
        title: unreadCount > 0 ? `Notifications (${unreadCount})` : 'Notifications',
        showBack: true,
        right: unreadCount > 0 ? `<button class="icon-btn" onclick="markAllRead()" style="font-size:11px;color:var(--accent);font-weight:600;width:auto;padding:0 4px;">All read</button>` : ''
      })}
      <div class="screen-body">
        ${notifications.map((n, i) => {
          const ic = NOTIF_ICONS[n.type] || NOTIF_ICONS.response;
          return `
            <div class="notif-item${n.read ? '' : ' unread'}" onclick="markRead(${i})">
              <div class="notif-icon-wrap" style="background:${ic.bg};">${ic.icon}</div>
              <div class="notif-content">
                <div class="notif-title">${n.title}</div>
                <div class="notif-body">${n.body}</div>
                <div class="notif-time">${n.time}</div>
              </div>
              ${!n.read ? '<div class="unread-indicator"></div>' : ''}
            </div>
          `;
        }).join('')}
        ${notifications.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-icon">🔔</div>
            <div class="empty-state-text">No notifications</div>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

window.markRead = function(idx) {
  notifications[idx].read = true;
  document.body.innerHTML = renderPhoneShell(renderNotifications());
};

window.markAllRead = function() {
  notifications.forEach(n => n.read = true);
  document.body.innerHTML = renderPhoneShell(renderNotifications());
  showToast('All notifications marked as read', 'success');
};

document.body.innerHTML = renderPhoneShell(renderNotifications());
</script>
</body>
</html>
