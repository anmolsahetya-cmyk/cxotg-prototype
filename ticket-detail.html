<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pearl CX — Ticket Detail (v2)</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    /* ----- Header + jump-nav (fixed chrome, not part of the scroll) ----- */
    .td-header {
      display: flex; align-items: center; gap: var(--sp-2);
      padding: 0 var(--sp-4); height: 52px; background: var(--bg-card);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .td-header-title { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: var(--text-lg); font-weight: 700; color: var(--text); }
    .td-jumpnav {
      display: flex; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4);
      overflow-x: auto; background: var(--bg-card); border-bottom: 1px solid var(--divider); flex-shrink: 0;
    }
    .td-jumpnav::-webkit-scrollbar { display: none; }
    .td-chip {
      white-space: nowrap; padding: 6px 14px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: background 150ms, color 150ms;
    }
    .td-chip.active { background: var(--accent-bg); color: var(--accent); }
    .td-chip:not(.active) { background: var(--bg-selection); color: var(--text-light); }

    /* ----- NPS / detractor banner ----- */
    .td-nps-banner { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-3) var(--sp-4) 0; padding: var(--sp-3); border-radius: var(--radius); background: rgba(248,82,113,0.08); border: 1px solid rgba(248,82,113,0.35); }
    .td-nps-score { width: 36px; height: 36px; border-radius: var(--radius); background: var(--detractor); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
    .td-nps-copy { flex: 1; min-width: 0; font-size: var(--text-sm); color: var(--text); line-height: 1.4; }
    .td-nps-copy b { color: var(--error); }

    /* ----- Customer card ----- */
    .td-customer-card { padding: var(--sp-3) var(--sp-4); }
    .td-customer-row { display: flex; align-items: center; gap: var(--sp-3); }
    .td-customer-name { font-size: var(--text-base); font-weight: 700; color: var(--text); }
    .td-customer-email { font-size: var(--text-sm); color: var(--text-light); margin-top: 2px; }
    .td-customer-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
    .td-customer-actions .btn { flex: 1; }

    /* ----- Status / Priority / Assign-to field cards ----- */
    .td-fieldcard-row { display: flex; gap: var(--sp-2); margin: var(--sp-2) var(--sp-4); }
    .td-fieldcard {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: var(--sp-3); cursor: pointer; transition: background 120ms, border-color 120ms;
    }
    .td-fieldcard:active { background: var(--bg-selection); }
    .td-fieldcard-label { font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--sp-2); }
    .td-fieldcard-value-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
    .td-fieldcard-value { display: flex; align-items: center; gap: 8px; font-size: var(--text-base); font-weight: 700; color: var(--text); min-width: 0; }
    .td-fieldcard-value span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .td-fieldcard-chevron { color: var(--text-light); flex-shrink: 0; display: flex; }
    .td-status-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .td-priority-flag { flex-shrink: 0; display: flex; }

    .td-assigncard {
      display: flex; align-items: center; gap: var(--sp-3); background: var(--bg-card);
      border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-3);
      margin: var(--sp-2) var(--sp-4); cursor: pointer; transition: background 120ms;
    }
    .td-assigncard:active { background: var(--bg-selection); }
    .td-assigncard-body { flex: 1; min-width: 0; }
    .td-assigncard-label { font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .td-assigncard-name { font-size: var(--text-base); font-weight: 700; color: var(--text); }

    /* ----- Picker rows (Status / Priority / Assignee sheets) ----- */
    .td-picker-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); cursor: pointer; border-bottom: 1px solid var(--divider); transition: background 120ms; }
    .td-picker-row:last-child { border-bottom: none; }
    .td-picker-row:active { background: var(--bg-selection); }
    .td-picker-row.selected { background: var(--accent-bg); }
    .td-picker-label { flex: 1; font-size: var(--text-base); font-weight: 600; color: var(--text); }
    .td-picker-row.selected .td-picker-label { color: var(--accent); }
    .td-picker-sub { font-size: 12px; color: var(--text-light); margin-top: 1px; }
    .td-picker-check { color: var(--accent); flex-shrink: 0; display: flex; }

    /* ----- AI tag buttons ----- */
    .td-ai-tag-label { font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.4px; margin-top: var(--sp-3); margin-bottom: var(--sp-2); }
    .td-ai-tag-wrap { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .td-ai-tag-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--accent-bg); border: 1px solid rgba(27,135,230,0.35); color: var(--accent);
      border-radius: var(--radius-sm); padding: 7px 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 120ms;
    }
    .td-ai-tag-chip:active { background: rgba(27,135,230,0.25); }

    /* ----- Root cause inline card ----- */
    .td-rc-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--sp-2); }
    .td-rc-chip { background: var(--bg-selection); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; color: var(--text); }
    .td-rc-edit-link { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: var(--sp-2); cursor: pointer; }

    /* ----- CRC tree (rendered inside a bottom sheet) ----- */
    .crc-section-head { display: flex; align-items: center; background: var(--bg-selection); border: 1px solid var(--border); border-radius: var(--radius); height: 48px; padding: 0 var(--sp-3); cursor: pointer; margin-bottom: var(--sp-2); }
    .crc-section-head span { flex: 1; font-size: var(--text-sm); font-weight: 600; color: var(--text); }
    .crc-item { background: var(--bg-card); border: 1px solid var(--divider); border-radius: var(--radius); padding: var(--sp-3); margin-bottom: var(--sp-2); cursor: pointer; }
    .crc-item-row { display: flex; align-items: center; gap: var(--sp-3); }
    .crc-sub-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) 0 var(--sp-2) var(--sp-5); border-top: 1px solid var(--divider); margin-top: var(--sp-2); cursor: pointer; }
    .crc-cb { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--border-2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .crc-cb.checked { background: var(--accent); border-color: var(--accent); }
    .crc-other-input { flex: 1; border: none; border-bottom: 1.5px solid var(--border); background: var(--bg-selection); padding: var(--sp-2) var(--sp-3); font-size: var(--text-base); font-family: var(--font); outline: none; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }

    /* ----- Share ticket preview ----- */
    .td-share-preview { margin: var(--sp-2) var(--sp-4) 0; padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .td-share-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
    .td-share-title { font-size: 20px; font-weight: 700; color: var(--text); }
    .td-share-field { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: var(--text-sm); color: var(--text-light); }
    .td-share-value { display: flex; align-items: center; gap: 6px; color: var(--text); font-weight: 600; }
    .td-share-desc-label { font-size: var(--text-sm); color: var(--text-light); margin-top: var(--sp-2); }
    .td-share-desc { font-size: var(--text-sm); color: var(--text); line-height: 1.5; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .td-share-divider { height: 1px; background: var(--divider); margin: var(--sp-3) 0; }
    .td-share-footer { font-size: 11px; color: var(--text-light); text-align: center; }

    /* ----- More sheet ----- */
    .td-more-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); cursor: pointer; }
    .td-more-row:active { background: var(--bg-selection); }

    /* ----- Add comment box (inside Comments sheet) ----- */
    .td-add-comment { padding: var(--sp-2) var(--sp-4) var(--sp-4); }

    /* ----- Comments / Activity inline summary cards ----- */
    .td-summary-card { margin: var(--sp-2) var(--sp-4); padding: var(--sp-2) var(--sp-4) 0; cursor: pointer; transition: background 120ms; }
    .td-summary-card:active { background: var(--bg-selection); }
    .td-summary-viewall {
      display: flex; align-items: center; gap: 4px; justify-content: center;
      padding: var(--sp-3) 0; margin-top: var(--sp-1); border-top: 1px solid var(--divider);
      font-size: 13px; font-weight: 600; color: var(--accent);
    }

    /* ----- Description show more/less ----- */
    .td-desc-text { font-size: var(--text-sm); color: var(--text); line-height: 1.5; }
    .td-desc-text.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .td-desc-toggle { font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer; margin-top: var(--sp-2); }
  </style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/components.js"></script>
<script>

/* ============================================================
   Load ticket
   ============================================================ */
const storedId = localStorage.getItem('selectedTicketId') || 'TKT-1041';
let ticket = DATA.tickets.find(t => t.id === storedId) || DATA.tickets[0];
ticket = JSON.parse(JSON.stringify(ticket));

/* ============================================================
   Screen state
   ============================================================ */
const _expandedReplies = new Set();
let _replyingTo = null;
let _actSort = 'latest';
const _crcExpanded = new Set();
const _crcSelected = new Set();
let _otherChecked = false;
let _otherText = '';
let _descExpanded = false;
let _descOverflows = false;

/* ============================================================
   Clipboard helper
   ============================================================ */
function _copyToClipboard(text, message) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {});
  }
  showToast(message, 'success');
}

window.copyTicketId = function() {
  _copyToClipboard(ticket.id, 'Ticket ID copied to clipboard');
};

/* ============================================================
   AI tag → Closedloop filter handoff
   ============================================================ */
window.filterByTag = function(tag) {
  localStorage.setItem('pendingTagFilter', tag);
  window.location.href = 'ticket-list.html';
};

/* ============================================================
   Main render
   ============================================================ */
function renderDetail() {
  const assignee = getManager(ticket.assigneeId);
  const segment  = getSegment(ticket.segmentId);

  return `
    <div class="screen-content">
      <div class="td-header">
        <button class="icon-btn" onclick="window.history.length>1?window.history.back():window.location.href='ticket-list.html'">
          ${renderIcon('back', 22)}
        </button>
        <div class="td-header-title">
          <span>Ticket #${ticket.id.replace('TKT-', '')}</span>
          <button class="icon-btn" style="width:28px;height:28px;" onclick="copyTicketId()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <button class="icon-btn" onclick="openMoreSheet()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
      </div>

      <div class="td-jumpnav" id="td-jumpnav">
        <div class="td-chip active" data-target="sec-top" onclick="jumpTo('sec-top')">Overview</div>
        <div class="td-chip" data-target="sec-rootcause" onclick="jumpTo('sec-rootcause')">Root cause</div>
        <div class="td-chip" data-target="sec-comments" onclick="jumpTo('sec-comments')">Comments</div>
        <div class="td-chip" data-target="sec-activity" onclick="jumpTo('sec-activity')">Activity</div>
      </div>

      <div class="screen-body" id="td-body" style="background:var(--bg-page);">
        ${_renderNpsBanner()}

        <div id="sec-top">
          <div class="card td-customer-card" style="margin:var(--sp-3) var(--sp-4) var(--sp-2);">
            <div class="td-customer-row">
              ${renderAvatar(ticket.customer, '#CC6677', 'lg')}
              <div style="min-width:0;">
                <div class="td-customer-name">${ticket.customer || 'Anonymous'}</div>
                <div class="td-customer-email">${ticket.email}</div>
              </div>
            </div>
            <div class="td-customer-actions">
              ${ticket.phone ? `
                <div class="btn btn-outline btn-sm" onclick="showToast('Calling ${ticket.customer || 'Anonymous'}…','info')">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  Call
                </div>
              ` : ''}
              <div class="btn btn-outline btn-sm" onclick="window.location.href='send-email.html'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
                Email
              </div>
            </div>
          </div>

          <div class="td-fieldcard-row">
            <div class="td-fieldcard" id="td-status-card" onclick="openStatusSheet()">${_statusCardInnerHTML()}</div>
            <div class="td-fieldcard" id="td-priority-card" onclick="openPrioritySheet()">${_priorityCardInnerHTML()}</div>
          </div>

          <div class="td-assigncard" id="td-assign-card" onclick="openAssigneeSheet()">${_assignCardInnerHTML()}</div>

          <div class="card" style="margin:var(--sp-2) var(--sp-4);">
            <div class="detail-row"><div class="detail-label">Segment</div><div class="detail-value">${segment.name}</div></div>
            <div class="detail-row"><div class="detail-label">Created</div><div class="detail-value">${formatDate(ticket.issueDate)}</div></div>
          </div>

          <div class="card" style="margin:var(--sp-2) var(--sp-4);padding:var(--sp-3) var(--sp-4);">
            <div class="section-heading" style="padding:0 0 6px;">Description</div>
            <div id="td-desc-wrap">${_descriptionHTML()}</div>
            ${ticket.tags?.length ? `
              <div class="td-ai-tag-label">AI tags</div>
              <div class="td-ai-tag-wrap">
                ${ticket.tags.map(t => `<span class="td-ai-tag-chip" onclick="filterByTag('${t.replace(/'/g, "\\'")}')">${t}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        </div>

        <div id="sec-rootcause">
          <div class="card" style="margin:var(--sp-2) var(--sp-4);padding:var(--sp-3) var(--sp-4);">
            <div class="section-heading" style="padding:0 0 6px;">Root cause</div>
            <div id="td-rootcause-inner">${_rootCauseInnerHTML()}</div>
          </div>
        </div>

        <div id="sec-comments">
          <div class="section-heading">Comments</div>
          <div id="td-comments-summary">${_commentsSummaryHTML()}</div>
        </div>

        <div id="sec-activity">
          <div class="section-heading">Activity</div>
          <div id="td-activity-summary">${_activitySummaryHTML()}</div>
        </div>

        <div style="height:var(--sp-6);"></div>
      </div>
    </div>
  `;
}

/* ============================================================
   Description — show more/less
   ============================================================ */
function _descriptionHTML() {
  const text = ticket.description || '';
  return `
    <div class="td-desc-text${_descExpanded ? '' : ' clamped'}" id="td-desc-text">${text}</div>
    <div class="td-desc-toggle" id="td-desc-toggle" style="display:none;" onclick="toggleDescription()">${_descExpanded ? 'Show less' : '…Show more'}</div>
  `;
}

function _refreshDescOverflow() {
  const el = document.getElementById('td-desc-text');
  const toggle = document.getElementById('td-desc-toggle');
  if (!el || !toggle) return;
  if (!_descExpanded) _descOverflows = el.scrollHeight > el.clientHeight + 1;
  toggle.style.display = _descOverflows ? 'block' : 'none';
}

window.toggleDescription = function() {
  _descExpanded = !_descExpanded;
  document.getElementById('td-desc-wrap').innerHTML = _descriptionHTML();
  _refreshDescOverflow();
};

/* ============================================================
   More sheet (Share, Delete)
   ============================================================ */
window.openMoreSheet = function() {
  openSheet('more', `
    <div class="td-more-row" onclick="closeSheet('more');openShareSheet();">
      ${renderIcon('send', 20)}
      <span style="font-size:var(--text-base);font-weight:600;color:var(--text);">Share ticket</span>
    </div>
    <div class="td-more-row" style="color:var(--error);" onclick="closeSheet('more');openDeleteConfirm();">
      ${renderIcon('trash', 20)}
      <span style="font-size:var(--text-base);font-weight:600;">Delete ticket</span>
    </div>
  `, 'More actions');
};

/* ============================================================
   Share ticket — preview sheet + generated shareable image
   ============================================================ */
function _nowLabel() {
  const d = new Date();
  const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return `${date} ${time}`;
}

window.openShareSheet = function() {
  openSheet('share', _shareSheetBodyHTML(), 'Share ticket');
};

function _shareSheetBodyHTML() {
  const assignee = getManager(ticket.assigneeId);
  const segment  = getSegment(ticket.segmentId);
  const s = DATA.statusMap[ticket.statusId];
  const p = DATA.priorityMap[ticket.priorityId];
  return `
    <div class="td-share-preview" id="td-share-preview">
      <div class="td-share-row-top">
        <span class="td-share-title">Ticket #${ticket.id.replace('TKT-', '')}</span>
        <span class="status-pill ${s.cssClass}">${s.label}</span>
      </div>
      <div class="td-share-field"><span>Priority</span><span class="td-share-value">${_priorityFlagSVG(_PRIORITY_COLORS[ticket.priorityId], 15)}${p.label}</span></div>
      <div class="td-share-field"><span>Customer:</span><span class="td-share-value">${ticket.customer || 'Anonymous'}</span></div>
      <div class="td-share-field"><span>Assigned to:</span><span class="td-share-value">${assignee.name}</span></div>
      <div class="td-share-field"><span>Current segment:</span><span class="td-share-value">${segment.name}</span></div>
      <div class="td-share-field"><span>Created on:</span><span class="td-share-value">${formatDate(ticket.issueDate)}</span></div>
      <div class="td-share-desc-label">Description:</div>
      <div class="td-share-desc">${ticket.description || ''}</div>
      ${ticket.tags?.length ? `
        <div class="td-ai-tag-wrap" style="padding-top:var(--sp-2);">
          ${ticket.tags.map(t => `<span class="td-ai-tag-chip" style="cursor:default;">${t}</span>`).join('')}
        </div>
      ` : ''}
      <div class="td-share-divider"></div>
      <div class="td-share-footer">Generated on ${_nowLabel()}</div>
    </div>
    <div class="sheet-footer" style="display:flex;gap:var(--sp-3);">
      <div class="btn btn-outline btn-full" onclick="closeSheet('share')">Cancel</div>
      <div class="btn btn-primary btn-full" onclick="doShareTicket()">Share</div>
    </div>
  `;
}

/* ----- Canvas rendering of the shareable image ----- */
function _wrapText(ctx, text, maxWidth) {
  const words = (text || '').split(' ');
  const lines = [];
  let line = '';
  words.forEach(w => {
    const test = line ? `${line} ${w}` : w;
    if (line && ctx.measureText(test).width > maxWidth) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines;
}

function _roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const _STATUS_FILL_HEX = ['#ffffff', '#9FE4AC', '#FFC7A2', '#8DC3F2'];
const _STATUS_BORDER_HEX = ['#9B9B9B', '#40CA5A', '#FF9145', '#1b87e6'];
const _STATUS_TEXT_HEX = ['#9B9B9B', '#228B3A', '#B35A00', '#0A5BAA'];
const _PRIORITY_HEX_SOLID = ['#42BD84', '#F6C140', '#E4632D', '#DA2222'];
const _FLAG_PATH = 'M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z';

function _buildShareCanvas() {
  const W = 720, PAD = 32, FONT = '-apple-system, "Segoe UI", sans-serif';
  const assignee = getManager(ticket.assigneeId);
  const segment  = getSegment(ticket.segmentId);
  const s = DATA.statusMap[ticket.statusId];
  const p = DATA.priorityMap[ticket.priorityId];

  const measure = document.createElement('canvas').getContext('2d');
  measure.font = `14px ${FONT}`;
  const descLines = _wrapText(measure, ticket.description, W - PAD * 2).slice(0, 4);

  measure.font = `600 14px ${FONT}`;
  const tagPadX = 14, tagGap = 10, tagH = 34;
  const tags = ticket.tags || [];
  const tagRows = [[]];
  let rowWidth = 0;
  tags.forEach(t => {
    const w = measure.measureText(t).width + tagPadX * 2;
    if (rowWidth > 0 && rowWidth + w + tagGap > W - PAD * 2) { tagRows.push([]); rowWidth = 0; }
    tagRows[tagRows.length - 1].push({ text: t, w });
    rowWidth += w + tagGap;
  });

  const headerH = 60, rowH = 40, fieldRows = 5;
  const descH = 24 + descLines.length * 22 + 12;
  const tagsH = tags.length ? tagRows.length * (tagH + 10) + 8 : 0;
  const footerH = 46;
  const totalH = PAD + headerH + fieldRows * rowH + descH + tagsH + footerH + PAD;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = totalH;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, totalH);
  ctx.strokeStyle = '#E4E4E4';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, totalH - 2);

  let y = PAD + 8;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#404A5B';
  ctx.font = `700 26px ${FONT}`;
  ctx.fillText(`Ticket #${ticket.id.replace('TKT-', '')}`, PAD, y + 14);

  ctx.font = `600 14px ${FONT}`;
  const pillLabel = s.label;
  const pillW = ctx.measureText(pillLabel).width + 32;
  const pillH = 32, pillX = W - PAD - pillW, pillY = y - pillH / 2 + 14;
  _roundRectPath(ctx, pillX, pillY, pillW, pillH, pillH / 2);
  ctx.fillStyle = _STATUS_FILL_HEX[ticket.statusId];
  ctx.fill();
  ctx.strokeStyle = _STATUS_BORDER_HEX[ticket.statusId];
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = _STATUS_TEXT_HEX[ticket.statusId];
  ctx.textAlign = 'center';
  ctx.fillText(pillLabel, pillX + pillW / 2, pillY + pillH / 2 + 1);
  ctx.textAlign = 'left';

  y += headerH;

  function drawField(label, value, drawFlag) {
    ctx.font = `14px ${FONT}`;
    ctx.fillStyle = '#8E9AAD';
    ctx.fillText(label, PAD, y + rowH / 2);
    ctx.font = `600 15px ${FONT}`;
    ctx.fillStyle = '#404A5B';
    ctx.textAlign = 'right';
    let valueX = W - PAD;
    if (drawFlag) {
      const flagColor = _PRIORITY_HEX_SOLID[ticket.priorityId];
      const textW = ctx.measureText(value).width;
      valueX = W - PAD - 22;
      ctx.fillText(value, W - PAD, y + rowH / 2);
      ctx.save();
      ctx.translate(valueX - textW - 16, y + rowH / 2 - 8);
      ctx.scale(0.7, 0.7);
      const path = new Path2D(_FLAG_PATH);
      ctx.fillStyle = flagColor;
      ctx.fill(path);
      ctx.restore();
    } else {
      ctx.fillText(value, W - PAD, y + rowH / 2);
    }
    ctx.textAlign = 'left';
    y += rowH;
  }

  drawField('Priority', p.label, true);
  drawField('Customer:', ticket.customer || 'Anonymous', false);
  drawField('Assigned to:', assignee.name, false);
  drawField('Current segment:', segment.name, false);
  drawField('Created on:', formatDate(ticket.issueDate), false);

  y += 8;
  ctx.font = `600 15px ${FONT}`;
  ctx.fillStyle = '#404A5B';
  ctx.fillText('Description:', PAD, y);
  y += 22;
  ctx.font = `14px ${FONT}`;
  ctx.fillStyle = '#545E6B';
  descLines.forEach(line => { ctx.fillText(line, PAD, y); y += 22; });
  y += 12;

  if (tags.length) {
    tagRows.forEach(row => {
      let x = PAD;
      row.forEach(tg => {
        _roundRectPath(ctx, x, y, tg.w, tagH, 6);
        ctx.fillStyle = '#EEF3FB';
        ctx.fill();
        ctx.strokeStyle = '#BDD7F5';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#1b87e6';
        ctx.font = `600 14px ${FONT}`;
        ctx.fillText(tg.text, x + tagPadX, y + tagH / 2);
        x += tg.w + tagGap;
      });
      y += tagH + 10;
    });
    y += 8;
  }

  ctx.strokeStyle = '#E4E4E4';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PAD, y);
  ctx.lineTo(W - PAD, y);
  ctx.stroke();
  y += 30;

  ctx.font = `12px ${FONT}`;
  ctx.fillStyle = '#9B9B9B';
  ctx.textAlign = 'center';
  ctx.fillText(`Generated on ${_nowLabel()}`, W / 2, y);
  ctx.textAlign = 'left';

  return canvas;
}

window.doShareTicket = function() {
  const canvas = _buildShareCanvas();
  canvas.toBlob(async (blob) => {
    if (!blob) { showToast('Could not generate image', 'error'); return; }
    const file = new File([blob], `ticket-${ticket.id}.png`, { type: 'image/png' });
    const shareText = `Ticket #${ticket.id.replace('TKT-', '')} — ${ticket.customer || 'Anonymous'}`;

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: shareText, text: shareText });
        closeSheet('share');
        return;
      } catch (e) { if (e.name === 'AbortError') return; }
    }
    if (navigator.share) {
      try {
        await navigator.share({ title: shareText, text: `${shareText}\n${ticket.description || ''}` });
        closeSheet('share');
        return;
      } catch (e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ticket-${ticket.id}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast('Image saved — attach it to WhatsApp, Slack, or email', 'success');
    closeSheet('share');
  }, 'image/png');
};

function _crcCount(section) {
  let n = 0;
  section.items.forEach(item => {
    if (item.subItems?.length) item.subItems.forEach(s => { if (_crcSelected.has(s.id)) n++; });
    else if (_crcSelected.has(item.id)) n++;
  });
  return n;
}

function _crcCb(checked) {
  return `<div class="crc-cb${checked ? ' checked' : ''}">${checked ? renderIcon('check', 13) : ''}</div>`;
}

function _crcSectionHTML(section) {
  const isOpen = _crcExpanded.has(section.id);
  const count = _crcCount(section);
  return `
    <div class="crc-section">
      <div class="crc-section-head" onclick="crcToggleSection('${section.id}')">
        <span>${section.name} (${count})</span>
        ${renderIcon(isOpen ? 'chevron_down' : 'chevron_right', 16)}
      </div>
      ${isOpen ? section.items.map(_crcItemHTML).join('') : ''}
    </div>
  `;
}

function _crcItemHTML(item) {
  const hasSubs = item.subItems?.length > 0;
  const isSel = _crcSelected.has(item.id);
  if (!hasSubs) {
    return `
      <div class="crc-item" onclick="crcToggle('${item.id}')">
        <div class="crc-item-row">${_crcCb(isSel)}<span style="font-size:var(--text-sm);color:var(--text);">${item.name}</span></div>
      </div>`;
  }
  return `
    <div class="crc-item">
      <div class="crc-item-row" onclick="crcToggle('${item.id}')">${_crcCb(isSel)}<span style="font-size:var(--text-sm);color:var(--text);">${item.name}</span></div>
      ${item.subItems.map(sub => `
        <div class="crc-sub-row" onclick="crcToggle('${sub.id}')">${_crcCb(_crcSelected.has(sub.id))}<span style="font-size:13px;color:var(--text);">${sub.name}</span></div>
      `).join('')}
    </div>`;
}

function _crcBodyHTML() {
  const tree = DATA.centralizedRootCauseTree;
  const active = _crcSelected.size > 0 || _otherChecked;
  return `
    <div style="padding-bottom:var(--sp-3);">
      ${tree.map(_crcSectionHTML).join('')}
      <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;">
        <div class="crc-cb${_otherChecked ? ' checked' : ''}" onclick="crcToggleOther()">${_otherChecked ? renderIcon('check', 13) : ''}</div>
        <input class="crc-other-input" type="text" placeholder="Other" value="${_otherText}"
          ${_otherChecked ? '' : 'disabled'} oninput="_otherText=this.value" />
      </div>
    </div>
    <div class="sheet-footer">
      <div class="btn ${active ? 'btn-primary' : 'btn-disabled btn-secondary'} btn-full" onclick="${active ? 'submitCRC()' : 'void 0'}">Update</div>
    </div>
  `;
}

window.crcToggleSection = function(id) {
  if (_crcExpanded.has(id)) _crcExpanded.delete(id); else _crcExpanded.add(id);
  updateSheetBody('crc', _crcBodyHTML());
};
window.crcToggle = function(id) {
  if (_crcSelected.has(id)) _crcSelected.delete(id); else _crcSelected.add(id);
  updateSheetBody('crc', _crcBodyHTML());
};
window.crcToggleOther = function() {
  _otherChecked = !_otherChecked;
  if (!_otherChecked) _otherText = '';
  updateSheetBody('crc', _crcBodyHTML());
};

window.submitCRC = function() {
  const tree = DATA.centralizedRootCauseTree;
  const newCauses = [];
  tree.forEach(section => {
    section.items.forEach(item => {
      if (item.subItems?.length) {
        item.subItems.forEach(sub => { if (_crcSelected.has(sub.id)) newCauses.push({ path: `${section.name} > ${item.name}`, tag: sub.name }); });
      } else if (_crcSelected.has(item.id)) {
        newCauses.push({ path: section.name, tag: item.name });
      }
    });
  });
  if (_otherChecked && _otherText.trim()) newCauses.push({ path: 'Other', tag: _otherText.trim() });
  ticket.centralizedRootCauses = newCauses;
  closeSheet('crc');
  _refreshRootCause();
  showToast('Root cause updated', 'success');
};

  return { author: last.author, initials: last.initials, text: last.text, time: last.date || last.time };
}

window.submitReply = function(parentId) {
  const inp = document.getElementById(`reply-text-${parentId}`);
  const text = inp?.value?.trim();
  if (!text) return;
  const parent = ticket.comments.find(c => c.id === parentId);
  if (!parent) return;
  parent.replies = parent.replies || [];
  parent.replies.push({ id: Date.now(), author: DATA.user.name, initials: DATA.user.initials, date: 'just now', text });
  _expandedReplies.add(parentId);
  _replyingTo = null;
  _refreshComments();
  showToast('Reply added', 'success');
};
window.submitComment = function() {
  const input = document.getElementById('td-comment-input');
  const text = input?.value?.trim();
  if (!text) return;
  ticket.comments.push({ id: ticket.comments.length + 1, author: DATA.user.name, initials: DATA.user.initials, time: 'just now', date: 'just now', text, isInternal: true, replies: [] });
  input.value = '';
  _refreshComments();
  showToast('Comment added', 'success');
};

/* ============================================================
   Activity — embedded section
   ============================================================ */
function _activityColor(type) {
  return {
    status: 'var(--activity-status)', priority: 'var(--activity-priority)',
    comment: 'var(--activity-comment)', email: 'var(--activity-email)', create: 'var(--activity-create)',
  }[type] || 'var(--activity-create)';
}

function _activityRowHTML(a) {
  return `
    <div class="activity-item" style="padding:var(--sp-2) 0;">
      <div class="activity-dot-col"><div class="activity-dot" style="background:${_activityColor(a.type)};"></div></div>
      <div class="activity-content">
        <div class="activity-title">${a.text.replace(/<\/?b>/g, '')}</div>
        <div class="activity-meta">${a.actor} · ${a.date || a.time || ''}</div>
      </div>
    </div>
  `;
}

/* ----- Inline summary card (main page) — latest 2 events only ----- */
function _activitySummaryHTML() {
  const count = ticket.activity.length;
  if (!count) {
    return `
      <div class="card td-summary-card" onclick="openActivitySheet()">
        <div class="empty-state" style="padding:var(--sp-4) 0;">
          <div class="empty-state-icon" style="font-size:28px;">🕓</div>
          <div class="empty-state-text" style="font-size:var(--text-sm);">No activity yet</div>
        </div>
      </div>`;
  }
  const latest = ticket.activity.slice(0, 2);
  return `
    <div class="card td-summary-card" onclick="openActivitySheet()" style="padding:var(--sp-1) var(--sp-4) 0;">
      ${latest.map(_activityRowHTML).join('')}
      <div class="td-summary-viewall">Show all ${count} activit${count === 1 ? 'y' : 'ies'} ${renderIcon('chevron_right', 15)}</div>
    </div>`;
}

/* ----- Dedicated Activity bottom sheet (full list + sort) ----- */
window.openActivitySheet = function() {
  openSheet('activity', _activitySheetBodyHTML(), 'Activity');
};

function _activitySheetBodyHTML() {
  if (!ticket.activity.length) {
    return `<div class="empty-state" style="padding:var(--sp-6) 0;"><div class="empty-state-icon">🕓</div><div class="empty-state-text">No activity yet</div></div>`;
  }
  const list = _actSort === 'latest' ? [...ticket.activity] : [...ticket.activity].reverse();
  return `
    <div style="display:flex;justify-content:flex-end;padding:var(--sp-2) var(--sp-4);">
      <div onclick="toggleActSort()" style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:var(--text-light);font-weight:600;">
        ${_actSort === 'latest' ? 'Latest' : 'Oldest'} ${renderIcon('chevron_down', 14)}
      </div>
    </div>
    <div style="padding:0 var(--sp-4);">
      ${list.map(_activityRowHTML).join('')}
    </div>
  `;
}

window.toggleActSort = function() {
  _actSort = _actSort === 'latest' ? 'oldest' : 'latest';
  updateSheetBody('activity', _activitySheetBodyHTML());
};

/* ============================================================
   Jump-nav scroll + active-chip tracking
   ============================================================ */
let _jumpNavLock = false;

window.jumpTo = function(id) {
  const chips = document.getElementById('td-jumpnav');
  chips?.querySelectorAll('.td-chip').forEach(c => c.classList.remove('active'));
  chips?.querySelector(`[data-target="${id}"]`)?.classList.add('active');
  // Suppress the scroll observer while the smooth scroll animates so it
  // doesn't fight the chip we just set (or flicker through sections it
  // scrolls past on the way to the target).
  _jumpNavLock = true;
  clearTimeout(window._jumpNavUnlockTimer);
  window._jumpNavUnlockTimer = setTimeout(() => { _jumpNavLock = false; }, 700);
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

function _initJumpNavObserver() {
  const body = document.getElementById('td-body');
  const chips = document.getElementById('td-jumpnav');
  if (!body || !chips) return;
  const sections = ['sec-top', 'sec-rootcause', 'sec-comments', 'sec-activity']
    .map(id => document.getElementById(id)).filter(Boolean);

  const observer = new IntersectionObserver((entries) => {
    if (_jumpNavLock) return;
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        chips.querySelectorAll('.td-chip').forEach(c => c.classList.remove('active'));
        chips.querySelector(`[data-target="${entry.target.id}"]`)?.classList.add('active');
      }
    });
  }, { root: body, rootMargin: '-10% 0px -60% 0px', threshold: 0 });

  sections.forEach(s => observer.observe(s));
}

/* ============================================================
   Init
   ============================================================ */
document.body.innerHTML = renderPhoneShell(renderDetail());
_initJumpNavObserver();
_refreshDescOverflow();

</script>
