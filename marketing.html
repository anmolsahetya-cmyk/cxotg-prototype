<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b87e6">
  <link rel="icon" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Pearl CX — Onboarding</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    /* ----- Shared auth text styles ----- */
    .auth-title { font-size: var(--text-2xl); font-weight: 700; color: var(--text); margin-bottom: var(--sp-2); }
    .auth-subtitle { font-size: var(--text-sm); color: var(--text-light); margin-bottom: var(--sp-5); line-height: 1.5; }
    .auth-cta { margin-top: var(--sp-2); }
    .auth-back-link { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--text-sm); font-weight: 600; color: var(--text-light); background: none; border: none; cursor: pointer; margin-bottom: var(--sp-5); padding: 0; align-self: flex-start; }
    .auth-forgot-link { text-align: center; margin-top: var(--sp-5); font-size: var(--text-base); font-weight: 600; color: var(--accent); background: none; border: none; cursor: pointer; }
    .auth-eye-toggle { pointer-events: auto; cursor: pointer; color: var(--text-light); display: flex; }
    .auth-eye-toggle:hover { color: var(--text); }
    .auth-icon-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--sp-4); }
    .auth-success { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--sp-3); }
    .auth-success-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(63,202,90,0.12); color: var(--success); display: flex; align-items: center; justify-content: center; margin-bottom: var(--sp-2); }
    .auth-success .auth-cta { width: 100%; margin-top: var(--sp-4); }
    .auth-center { text-align: center; }
    .checkbox.checked { color: #fff; }

    /* ----- Onboarding — scannable feature list (no carousel) ----- */
    .onboard-screen { flex: 1; display: flex; flex-direction: column; background: var(--bg-card); height: 100%; }
    .onboard-header { padding: var(--sp-6) var(--sp-5) var(--sp-4); flex-shrink: 0; }
    .onboard-logo-row img { width: 112px; height: auto; margin-bottom: var(--sp-5); }
    .onboard-headline { font-size: var(--text-2xl); font-weight: 700; color: var(--text); line-height: 1.25; margin-bottom: var(--sp-2); }
    .onboard-sub { font-size: var(--text-sm); color: var(--text-light); line-height: 1.5; }
    .onboard-list { flex: 1; overflow-y: auto; padding: 0 var(--sp-5); }
    .onboard-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) 0; border-bottom: 1px solid var(--divider); }
    .onboard-row:last-child { border-bottom: none; }
    .onboard-row-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .onboard-row-icon img { width: 38px; height: 38px; object-fit: contain; }
    .onboard-row-body { flex: 1; }
    .onboard-row-title { font-size: var(--text-base); font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .onboard-row-desc { font-size: var(--text-sm); color: var(--text-light); line-height: 1.4; }
    .onboard-footer { padding: var(--sp-4) var(--sp-5); flex-shrink: 0; }

    /* ----- Sign in / Forgot password — centered card on tinted backdrop ----- */
    .auth-backdrop { flex: 1; display: flex; flex-direction: column; justify-content: center; background: var(--bg-page); padding: var(--sp-5); overflow-y: auto; }
    .auth-card { background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); padding: var(--sp-6) var(--sp-5); }
    .auth-logo { display: block; width: 108px; height: auto; margin: 0 auto var(--sp-5); }
    .auth-remember-row { padding: 0; margin: var(--sp-1) 0 var(--sp-5); }
  </style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/components.js"></script>
<script>

const FEATURES = [
  { title: 'Swift ticket mastery',  desc: 'Handle customer tickets from anywhere, without missing a beat.', img: 'assets/marketing_01.svg' },
  { title: 'Customer pulse check',  desc: 'Respond fast to queries and feedback to keep every customer happy.', img: 'assets/marketing_02.svg' },
  { title: 'Customer insights',     desc: 'See NPS and satisfaction scores the moment they come in.', img: 'assets/marketing_03.svg' },
  { title: 'Proactive resolution',  desc: 'Catch major issues early so nothing falls through the cracks.', img: 'assets/marketing_04.svg' },
];

/* ============================================================
   Onboarding — scannable feature list
   ============================================================ */
function renderMarketing() {
  return `
    <div class="onboard-screen">
      <div class="onboard-header">
        <div class="onboard-logo-row"><img src="assets/questionpro_banner.svg" alt="QuestionPro"/></div>
        <div class="onboard-headline">Everything you need to delight customers</div>
        <div class="onboard-sub">One inbox for every ticket, insight, and follow-up — built for support on the move.</div>
      </div>
      <div class="onboard-list">
        ${FEATURES.map(f => `
          <div class="onboard-row">
            <div class="onboard-row-icon"><img src="${f.img}" alt=""/></div>
            <div class="onboard-row-body">
              <div class="onboard-row-title">${f.title}</div>
              <div class="onboard-row-desc">${f.desc}</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="onboard-footer">
        <button class="btn btn-primary btn-full" onclick="navigate(renderLogin)">Continue</button>
      </div>
    </div>
  `;
}

/* ============================================================
   Sign in / Forgot password
   Centered card on a tinted backdrop.
   ============================================================ */
let _rememberDevice = false;
window._toggleRemember = function() {
  _rememberDevice = !_rememberDevice;
  const box = document.getElementById('remember-box');
  if (!box) return;
  box.classList.toggle('checked', _rememberDevice);
  box.innerHTML = _rememberDevice ? renderIcon('check', 12) : '';
};

function renderLogin() {
  return `
    <div class="auth-backdrop" id="auth-root">
      <div class="auth-card">
        <img class="auth-logo" src="assets/questionpro_banner.svg" alt="QuestionPro"/>
        <div class="auth-title auth-center">Sign in to CX On The Go</div>
        <div class="auth-subtitle auth-center">Access your team's workspace to manage tickets.</div>
        <div class="input-group">
          <label class="input-label" for="login-code">Access code</label>
          <input type="text" id="login-code" class="input-field" value="RETAILCO" autocomplete="off"/>
        </div>
        <div class="input-group">
          <label class="input-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="input-field" value="sarah.chen@retailco.com" autocomplete="off"/>
        </div>
        <div class="input-group">
          <label class="input-label" for="login-password">Password</label>
          <div class="input-field-wrap">
            <input type="password" id="login-password" class="input-field" value="sunshine24" autocomplete="off"/>
            <span class="input-field-icon auth-eye-toggle" onclick="_authTogglePassword('login-password', this)">${renderIcon('eye', 18)}</span>
          </div>
        </div>
        <div class="checkbox-row auth-remember-row" onclick="_toggleRemember()">
          <div class="checkbox" id="remember-box"></div>
          <span class="checkbox-label">Remember this device</span>
        </div>
        <button class="btn btn-primary btn-full auth-cta" onclick="doLogin()">Sign in</button>
        <button class="auth-forgot-link" onclick="navigate(renderForgotPassword)">Forgot password?</button>
      </div>
    </div>
  `;
}

window._authTogglePassword = function(id, btn) {
  const input = document.getElementById(id);
  if (!input) return;
  const wasHidden = input.type === 'password';
  input.type = wasHidden ? 'text' : 'password';
  btn.innerHTML = renderIcon(wasHidden ? 'eye_off' : 'eye', 18);
};

function renderForgotPassword() { return _renderForgotState('form', ''); }

function _renderForgotState(state, email) {
  return `
    <div class="auth-backdrop" id="auth-fp-root">
      <div class="auth-card">
        <button class="auth-back-link" onclick="goBack()">${renderIcon('back', 18)} Back to sign in</button>
        ${state === 'form' ? `
          <div class="auth-icon-badge">${renderIcon('mail', 28)}</div>
          <div class="auth-title auth-center">Forgot your password?</div>
          <div class="auth-subtitle auth-center">No worries — enter the email tied to your account and we'll send you a link to reset it.</div>
          <div class="input-group">
            <label class="input-label" for="forgot-email">Email</label>
            <input type="email" id="forgot-email" class="input-field" autocomplete="off"/>
          </div>
          <button class="btn btn-primary btn-full auth-cta" onclick="_authSendReset()">Send reset link</button>
        ` : `
          <div class="auth-success">
            <div class="auth-success-icon">${renderIcon('check', 28)}</div>
            <div class="auth-title">Check your email</div>
            <div class="auth-subtitle">We sent a reset link to<br><strong style="color:var(--text);">${email}</strong></div>
            <button class="btn btn-primary btn-full auth-cta" onclick="goBack()">Back to sign in</button>
          </div>
        `}
      </div>
    </div>
  `;
}

window._authSendReset = function() {
  const email = document.getElementById('forgot-email')?.value || '';
  if (!email || !email.includes('@')) { showToast('Please enter a valid email address', 'error'); return; }
  const root = document.getElementById('auth-fp-root');
  if (root) root.outerHTML = _renderForgotState('success', email);
};

window.doLogin = function() {
  const email = document.getElementById('login-email')?.value;
  if (!email || !email.includes('@')) { showToast('Please enter a valid email address', 'error'); return; }
  showSpinner('Signing in…');
  setTimeout(() => { hideSpinner(); window.location.href = 'dashboard.html'; }, 1500);
};

/* ---- Init ---- */
document.body.innerHTML = renderPhoneShell(renderMarketing());
</script>
</body>
</html>
