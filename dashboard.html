<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pearl CX — Dashboard</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    /* ── Header ─────────────────────────────── */
    .dash-header {
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid #E4E4E4;
    }
    .dash-header-nav {
      display: flex;
      align-items: center;
      padding: 10px 12px 10px;
      gap: 8px;
      min-height: 56px;
    }
    .dash-title-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
      padding-left: 4px;
    }
    .dash-title {
      font-size: 20px;
      font-weight: 400;
      color: #1B3380;
      line-height: 1.2;
    }
    .dash-subtitle-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dash-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.85);
      line-height: 1.3;
    }
    .dash-bell-btn {
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dash-bell-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: #E53935;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      border-radius: 8px;
      min-width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      line-height: 1;
    }

    /* ── Date filter bar ─────────────────────── */
    .dash-date-bar {
      background: #fff;
      padding: 9px 17.5px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }
    .seg-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #E4E4E4;
      border-radius: 14px;
      padding: 12px 14px;
      background: #fff;
      cursor: pointer;
      font-family: var(--font);
      width: 100%;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .seg-pill-text { flex: 1; min-width: 0; text-align: left; }
    .seg-pill-eyebrow { font-size: 11.5px; color: #909090; }
    .seg-pill-value { font-size: 15px; color: #404A5B; font-weight: 600; margin-top: 1px; }
    .seg-pill:active { background: #F3F5F8; }
    .date-txt-btn {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      border: none;
      background: none;
      padding: 4px 0;
      cursor: pointer;
      font-size: 13px;
      color: #1b87e6;
      font-family: var(--font);
      width: 100%;
    }

    /* ── Scroll body ─────────────────────────── */
    .dash-body {
      flex: 1;
      overflow-y: auto;
      background: #F3F5F8;
      padding-bottom: 90px;
    }
    .dash-body::-webkit-scrollbar { display: none; }

    /* ── Cards ───────────────────────────────── */
    .dash-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.13);
      overflow: hidden;
    }
    .dash-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 17.5px 0 0;
    }
    .dash-carousel::-webkit-scrollbar { display: none; }
    .dash-carousel-item {
      flex: 0 0 100%;
      scroll-snap-align: start;
      min-width: 0;
      box-sizing: border-box;
      padding: 0 17.5px;
    }
    .nps-card, .cl-card {
      margin: 0;
    }
    .dash-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 12px 0 0;
    }
    .dash-dot {
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: #C9CFDA;
      transition: background 150ms, width 150ms;
    }
    .dash-dot.active {
      background: #1B3380;
      width: 16px;
    }

    /* ── Quick Action ─────────────────────── */
    .qa-title {
      padding: 20px 17.5px 4px;
      font-size: 15px;
      font-weight: 600;
      color: #1B3380;
    }
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 17.5px 4px;
    }

    /* Card title row */
    .card-title-row {
      display: flex;
      align-items: center;
      padding: 12px 15px 11px;
      gap: 8px;
    }
    .card-title-text {
      font-size: 15px;
      font-weight: 600;
      color: #1B3380;
      flex: 1;
    }
    .card-title-link {
      font-size: 14px;
      font-weight: 500;
      color: #1b87e6;
      cursor: pointer;
    }
    .card-title-icon {
      cursor: pointer;
      padding: 2px 4px;
    }
    .card-separator {
      height: 1px;
      background: rgba(0,0,0,0.08);
    }

    /* ── NPS gauge area ──────────────────────── */
    .nps-gauge-wrap {
      display: flex;
      justify-content: center;
      padding: 18px 10px 0;
    }
    .nps-score-area {
      text-align: center;
      padding: 2px 16px 12px;
    }
    .nps-score-value {
      font-size: 33px;
      font-weight: 700;
      color: #1B3380;
      line-height: 1.1;
    }
    .nps-score-label {
      font-size: 13px;
      color: #909090;
      margin-top: 2px;
    }
    .nps-goal-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 6px;
    }
    .nps-goal-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .nps-goal-key {
      font-size: 11px;
      color: #909090;
    }
    .nps-goal-val {
      font-size: 13px;
      font-weight: 600;
      color: #545E6B;
    }
    .nps-goal-val.negative { color: #F85271; }

    /* ── NPS response legend ─────────────────── */
    .nps-legend {
      padding: 10px 15px 14px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
    }
    .legend-sq {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .legend-name {
      font-size: 13px;
      color: #545E6B;
      flex: 1;
    }
    .legend-pct {
      font-size: 13px;
      font-weight: 500;
      color: #545E6B;
      width: 36px;
      text-align: right;
    }
    .legend-count {
      font-size: 13px;
      color: #545E6B;
      width: 52px;
      text-align: right;
    }
    .legend-row-total .legend-name {
      font-weight: 600;
      color: #1B3380;
    }
    .legend-row-total .legend-count {
      font-weight: 600;
      color: #1B3380;
    }

    /* ── Closedloop donut ────────────────────── */
    .cl-donut-wrap {
      display: flex;
      justify-content: center;
      padding: 14px 10px 8px;
      position: relative;
    }

    /* ── Closedloop legend ───────────────────── */
    .cl-legend {
      padding: 4px 15px 14px;
    }
    .cl-legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
    }
    .cl-legend-sq {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .cl-legend-name {
      font-size: 13px;
      color: #545E6B;
      flex: 1;
    }
    .cl-legend-pct {
      font-size: 13px;
      color: #909090;
      width: 36px;
      text-align: right;
    }
    .cl-legend-count {
      font-size: 13px;
      font-weight: 600;
      color: #1B3380;
      width: 36px;
      text-align: right;
    }

  </style>
</head>
<body>
<script src="shared/data.js"></script>
<script src="shared/components.js"></script>
<script>

let dashState = {
  segment: DATA.currentSegment,
  dateRange: DATA.dateRangeLabel,
};

/* ── Date filter state ──────────────────── */
let dfState = {
  tab: 'month',
  selectedMonth: 'Last 30 days',
  startDate: 'Jun 29, 2022',
  endDate: 'Jun 29, 2026',
};

const MONTH_OPTIONS = [
  'Last 30 days',
  'This month',
  'Last month',
  'Last 3 months',
  'Last 6 months',
];

/* ── NPS semicircle gauge SVG ─────────────────────────────────────
   viewBox: 300×175  cx=150 cy=155  outerR=115 innerR=78
   gaugePoint(r, θ): x = 150 - r·cos(θ°), y = 155 - r·sin(θ°)
   θ=0 → left (−100), θ=90 → top (0), θ=180 → right (+100)
   arc sweep-flag=1 → clockwise in screen coords (through the top)
   Segment angles use actual response percentages:
     detractor 63%  → 0° to 113.4°
     passive   18%  → 113.4° to 145.8°
     promoter  18%  → 145.8° to 180°
   Needle at θ = ((-45.26+100)/200)×180 = 49.27°
------------------------------------------------------------------- */
function renderNPSGauge() {
  return `
    <svg viewBox="0 0 300 175" width="280" height="163" xmlns="http://www.w3.org/2000/svg" style="display:block;">

      <!-- Grey background track -->
      <path d="M 35 155 A 115 115 0 1 1 265 155 L 228 155 A 78 78 0 1 0 72 155 Z" fill="#E8EAED"/>

      <!-- Detractor arc: 0° to 113.4° -->
      <path d="M 35 155 A 115 115 0 0 1 195.67 49.45 L 180.97 83.41 A 78 78 0 0 0 72 155 Z" fill="#F85271"/>

      <!-- Passive arc: 113.4° to 145.8° -->
      <path d="M 195.67 49.45 A 115 115 0 0 1 245.15 90.42 L 214.54 111.20 A 78 78 0 0 0 180.97 83.41 Z" fill="#F1DA7E"/>

      <!-- Promoter arc: 145.8° to 180° -->
      <path d="M 245.15 90.42 A 115 115 0 0 1 265 155 L 228 155 A 78 78 0 0 0 214.54 111.20 Z" fill="#42BD84"/>

      <!-- Dashed goal line at θ=90° (NPS=0, top) -->
      <line x1="150" y1="40" x2="150" y2="155" stroke="#545E6B" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- Needle at θ=49.27° (value −45.26) -->
      <line x1="157.8" y1="164.1" x2="80.8" y2="74.9" stroke="#1B3380" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Center pivot circle -->
      <circle cx="150" cy="155" r="6" fill="#1B3380"/>
      <circle cx="150" cy="155" r="3" fill="#fff"/>

      <!-- Axis labels -->
      <text x="8"   y="163" font-family="FiraSans,-apple-system,sans-serif" font-size="11" fill="#545E6B">-100</text>
      <text x="141" y="27"  font-family="FiraSans,-apple-system,sans-serif" font-size="11" fill="#545E6B">0</text>
      <text x="258" y="163" font-family="FiraSans,-apple-system,sans-serif" font-size="11" fill="#545E6B">100</text>
    </svg>
  `;
}

/* ── Closedloop full-circle donut SVG ─────────────────────────────
   viewBox: 280×280  cx=140 cy=140  outerR=120 innerR=80
   arcPoint(r, deg): x = 140 + r·cos(deg°), y = 140 + r·sin(deg°)
   SVG 0° = right, 270° = top; sweep-flag=1 = clockwise
   Starting from top (270°), clockwise:
     Critical 3%  → 270° to 280.8°
     Low 58%      → 280.8° to 489.6° (≡ 129.6°), large arc
     Medium 21%   → 129.6° to 205.2°
     High 18%     → 205.2° to 270°
------------------------------------------------------------------- */
function renderClosedloopDonut(cl) {
  return `
    <svg viewBox="0 0 280 280" width="260" height="260" xmlns="http://www.w3.org/2000/svg" style="display:block;">

      <!-- Critical 3%: 270° → 280.8° -->
      <path d="M 140 20 A 120 120 0 0 1 162.49 22.12 L 154.99 61.42 A 80 80 0 0 0 140 60 Z" fill="#F85271"/>

      <!-- Low 58%: 280.8° → 129.6° (large arc, sweep=1) -->
      <path d="M 162.49 22.12 A 120 120 0 1 1 63.51 232.46 L 88.99 201.64 A 80 80 0 1 0 154.99 61.42 Z" fill="#42BD84"/>

      <!-- Medium 21%: 129.6° → 205.2° -->
      <path d="M 63.51 232.46 A 120 120 0 0 1 31.42 88.90 L 67.62 105.94 A 80 80 0 0 0 88.99 201.64 Z" fill="#F1DA7E"/>

      <!-- High 18%: 205.2° → 270° -->
      <path d="M 31.42 88.90 A 120 120 0 0 1 140 20 L 140 60 A 80 80 0 0 0 67.62 105.94 Z" fill="#F9876A"/>

      <!-- Center labels -->
      <text x="140" y="133" font-family="FiraSans,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#1B3380" text-anchor="middle">${cl.totalTickets}</text>
      <text x="140" y="155" font-family="FiraSans,-apple-system,sans-serif" font-size="14" fill="#545E6B" text-anchor="middle">Tickets</text>
    </svg>
  `;
}

/* ── Ticket card (matches Closedloop) ────── */
const _PRI_COLORS = ['#42BD84', '#F6C140', '#E4632D', '#DA2222'];
const _PRI_LABELS = ['Low', 'Medium', 'High', 'Critical'];
const _STA_STYLE  = [
  'border:1px dotted #545E6B;color:#545E6B;background:transparent;',
  'background:#40CA5A;color:#fff;border:none;',
  'background:#FF9145;color:#fff;border:none;',
  'background:#1b87e6;color:#fff;border:none;',
];
const _STA_LABELS = ['New', 'Open', 'Escalated', 'Resolved'];
// Quick Action ordering: priority (Critical>High>Medium>Low), then status (Escalated>Open>New). Resolved is excluded.
const _QA_STATUS_RANK = { 2: 0, 1: 1, 0: 2 }; // Escalated, Open, New

function _shortDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function _priFlag(color) {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="${color}">
    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
    <line x1="4" y1="22" x2="4" y2="15" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

function renderTicketCard(ticket, onclick) {
  const pri = _PRI_COLORS[ticket.priorityId] || '#42BD84';
  const priLabel = _PRI_LABELS[ticket.priorityId] || 'Low';
  const staStyle = _STA_STYLE[ticket.statusId] || _STA_STYLE[0];
  const staLabel = _STA_LABELS[ticket.statusId] || 'New';
  const assignee = DATA.managers.find(m => m.id === ticket.assigneeId);
  const dateStr  = _shortDate(ticket.issueDate);
  const desc = (ticket.description || ticket.title || '');

  const datePillStyle = ticket.isOverdue
    ? 'background:#F85271;color:#fff;border:none;'
    : 'background:#EEF3FB;color:#545E6B;border:none;';

  const dateIconSVG = ticket.isOverdue
    ? `<svg width="13" height="13" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="white"/><rect x="11" y="7" width="2" height="6" rx="1" fill="#F85271"/><rect x="11" y="15" width="2" height="2" rx="1" fill="#F85271"/></svg>`
    : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#545E6B" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;

  return `
    <div onclick="${onclick}"
      style="background:#fff;border:1px solid #e2e4e8;border-radius:8px;padding:16px;cursor:pointer;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:5px;min-width:0;flex:1;margin-right:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9B9B9B" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span style="font-size:14px;color:#9B9B9B;font-family:var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${ticket.email}</span>
        </div>
        <span style="font-size:14px;color:#1b87e6;font-weight:600;font-family:var(--font);flex-shrink:0;">${ticket.id}</span>
      </div>
      <div style="font-size:16px;color:#404A5B;font-family:var(--font);line-height:1.45;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">
        ${desc}
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden;">
        ${assignee ? `<div style="width:28px;height:28px;border-radius:14px;background:${assignee.avatarColor};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;font-family:var(--font);flex-shrink:0;">${assignee.initials}</div>` : ''}
        <div style="display:flex;align-items:center;gap:4px;${datePillStyle}border-radius:20px;padding:5px 10px;flex-shrink:0;font-size:13px;font-family:var(--font);font-weight:500;">
          ${dateIconSVG}
          <span>${dateStr}</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
          ${_priFlag(pri)}
          <span style="font-size:13px;color:#545E6B;font-family:var(--font);">${priLabel}</span>
        </div>
        <div style="${staStyle}border-radius:20px;padding:5px 10px;font-size:13px;font-family:var(--font);font-weight:500;flex-shrink:0;white-space:nowrap;">
          ${staLabel}
        </div>
      </div>
    </div>
  `;
}

function getSnoozeDays() {
  const v = parseInt(localStorage.getItem('snoozeDays'), 10);
  return (v >= 1 && v <= 7) ? v : 1;
}

function _getSnoozeMap() {
  try { return JSON.parse(localStorage.getItem('ticketSnoozes')) || {}; }
  catch (e) { return {}; }
}

function _snoozeTicket(id) {
  const map = _getSnoozeMap();
  map[id] = Date.now() + getSnoozeDays() * 24 * 60 * 60 * 1000;
  localStorage.setItem('ticketSnoozes', JSON.stringify(map));
}

function _isSnoozed(id) {
  const map = _getSnoozeMap();
  return !!map[id] && map[id] > Date.now();
}

function _quickActionTickets() {
  const ordered = DATA.tickets
    .filter(t => t.statusId !== 3 && !_isSnoozed(t.id)) // exclude Resolved and currently-snoozed
    .slice()
    .sort((a, b) => {
      if (b.priorityId !== a.priorityId) return b.priorityId - a.priorityId; // Critical > High > Medium > Low
      return _QA_STATUS_RANK[a.statusId] - _QA_STATUS_RANK[b.statusId]; // Escalated > Open > New
    });
  const count = getQaCount();
  return ordered.slice(0, count);
}

function getQaCount() {
  const v = parseInt(localStorage.getItem('qaCount'), 10);
  return (v >= 1 && v <= 10) ? v : 5;
}

window.openTicket = function(id) {
  localStorage.setItem('selectedTicketId', id);
  window.location.href = 'ticket-detail.html';
};

/* ── Main render ──────────────────────────── */
function renderDashboard() {
  const nps = DATA.nps;
  const cl  = DATA.closedloop;

  return `
    <div class="screen-content">

      <!-- App bar -->
      <div class="dash-header">
        <div class="dash-header-nav">
          ${renderSegmentSelector(dashState.segment, 'dash-segment-label', "openSegmentSheet(dashState.segment, onSegmentSelect)")}

          <button class="dash-bell-btn" onclick="window.location.href='notifications.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#1B3380"/>
            </svg>
            <span class="dash-bell-badge">${DATA.notificationCount}</span>
          </button>
        </div>

        <!-- Date filter bar -->
        <div class="dash-date-bar">
          <button class="date-txt-btn" onclick="openDateSheet()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="4" width="18" height="17" rx="2" stroke="#1b87e6" stroke-width="2"/>
              <path d="M3 9h18M8 2v4M16 2v4" stroke="#1b87e6" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="dash-date-label">${dashState.dateRange}</span>
          </button>
        </div>
      </div>

      <!-- Scrollable body -->
      <div class="dash-body" id="dash-body">

        <!-- Swipeable NPS / Closedloop cards -->
        <div class="dash-carousel" id="dash-carousel" onscroll="onCarouselScroll()">
        <div class="dash-carousel-item">
        <!-- Closedloop Card -->
        <div class="dash-card cl-card">
          <div class="card-title-row">
            <span class="card-title-text">Closedloop</span>
            <a class="card-title-link" href="ticket-list.html">Tickets</a>
            <div class="card-title-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6h16M7 12h10M10 18h4" stroke="#545E6B" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <div class="card-separator"></div>

          <!-- Donut -->
          <div class="cl-donut-wrap">
            ${renderClosedloopDonut(cl)}
          </div>

          <!-- Closedloop legend -->
          <div class="cl-legend">
            <div class="cl-legend-row">
              <div class="cl-legend-sq" style="background:#F85271;"></div>
              <span class="cl-legend-name">Critical</span>
              <span class="cl-legend-pct">${cl.critical.pct}%</span>
              <span class="cl-legend-count">${cl.critical.count}</span>
            </div>
            <div class="cl-legend-row">
              <div class="cl-legend-sq" style="background:#F9876A;"></div>
              <span class="cl-legend-name">High</span>
              <span class="cl-legend-pct">${cl.high.pct}%</span>
              <span class="cl-legend-count">${cl.high.count}</span>
            </div>
            <div class="cl-legend-row">
              <div class="cl-legend-sq" style="background:#F1DA7E;"></div>
              <span class="cl-legend-name">Medium</span>
              <span class="cl-legend-pct">${cl.medium.pct}%</span>
              <span class="cl-legend-count">${cl.medium.count}</span>
            </div>
            <div class="cl-legend-row">
              <div class="cl-legend-sq" style="background:#42BD84;"></div>
              <span class="cl-legend-name">Low</span>
              <span class="cl-legend-pct">${cl.low.pct}%</span>
              <span class="cl-legend-count">${cl.low.count}</span>
            </div>
          </div>
        </div>
        </div>

        <div class="dash-carousel-item">
        <div class="dash-card nps-card">
          <div class="card-title-row">
            <span class="card-title-text">${dashState.segment} NPS</span>
          </div>
          <div class="card-separator"></div>

          <!-- Gauge -->
          <div class="nps-gauge-wrap">
            ${renderNPSGauge()}
          </div>

          <!-- Score -->
          <div class="nps-score-area">
            <div class="nps-score-value">${nps.score}</div>
            <div class="nps-score-label">NPS</div>
            <div class="nps-goal-row">
              <div class="nps-goal-item">
                <span class="nps-goal-key">Goal</span>
                <span class="nps-goal-val">${nps.goal}</span>
              </div>
              <div style="width:1px;height:28px;background:rgba(0,0,0,0.1);"></div>
              <div class="nps-goal-item">
                <span class="nps-goal-key">Gap</span>
                <span class="nps-goal-val negative">${nps.gap}</span>
              </div>
            </div>
          </div>

          <div class="card-separator"></div>

          <!-- Response legend -->
          <div class="nps-legend">
            <div class="legend-row">
              <div class="legend-sq" style="background:#F85271;"></div>
              <span class="legend-name">Detractors</span>
              <span class="legend-pct">${nps.detractors}%</span>
              <span class="legend-count">${nps.detractorCount.toLocaleString()}</span>
            </div>
            <div class="legend-row">
              <div class="legend-sq" style="background:#F1DA7E;"></div>
              <span class="legend-name">Passive</span>
              <span class="legend-pct">${nps.passives}%</span>
              <span class="legend-count">${nps.passiveCount.toLocaleString()}</span>
            </div>
            <div class="legend-row">
              <div class="legend-sq" style="background:#42BD84;"></div>
              <span class="legend-name">Promoters</span>
              <span class="legend-pct">${nps.promoters}%</span>
              <span class="legend-count">${nps.promoterCount.toLocaleString()}</span>
            </div>
            <div class="card-separator" style="margin:6px 0;"></div>
            <div class="legend-row legend-row-total">
              <div class="legend-sq" style="background:transparent;"></div>
              <span class="legend-name">Total</span>
              <span class="legend-pct"></span>
              <span class="legend-count">${nps.totalResponses.toLocaleString()}</span>
            </div>
          </div>
        </div>
        </div>
        </div>

        <!-- Dot indicators -->
        <div class="dash-dots" id="dash-dots">
          <div class="dash-dot active"></div>
          <div class="dash-dot"></div>
        </div>

        <!-- Quick Action -->
        <div class="qa-title">Quick Action</div>
        <div class="qa-list">
          ${_quickActionTickets().map(t => renderTicketCard(t, `openTicket('${t.id}')`)).join('')}
        </div>

        <div style="height:16px;"></div>
      </div><!-- end dash-body -->

      <!-- FAB -->
      <a class="fab" href="create-ticket.html" title="Create ticket">
        ${renderIcon('plus', 24)}
      </a>

    </div>
  `;
}

/* ── Date filter — full-screen overlay ──── */
function openDateSheet() {
  const overlay = document.createElement('div');
  overlay.id = 'df-overlay';
  overlay.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;z-index:200;background:#1B3380;display:flex;flex-direction:column;';
  overlay.innerHTML = renderDateFilter();
  document.getElementById('screen').appendChild(overlay);
}

function closeDateFilter() {
  const el = document.getElementById('df-overlay');
  if (el) el.remove();
}

function renderDateFilter() {
  const isCustom = dfState.tab === 'custom';

  const monthTabHTML = MONTH_OPTIONS.map(opt => {
    const active = opt === dfState.selectedMonth;
    return `<div
      onclick="window._dfSelectMonth('${opt}')"
      style="padding:20px 0;font-size:18px;color:${active ? '#1b87e6' : '#545E6B'};border-bottom:1px solid rgba(0,0,0,0.09);cursor:pointer;font-family:var(--font);"
    >${opt}</div>`;
  }).join('');

  const customTabHTML = `
    <div style="padding:28px 0 0;">
      <div style="font-size:18px;color:#545E6B;font-family:var(--font);">Start date</div>
      <div style="font-size:15px;color:#545E6B;margin-top:6px;padding-bottom:14px;font-family:var(--font);">${dfState.startDate}</div>
    </div>
    <div style="height:1px;background:rgba(0,0,0,0.12);"></div>
    <div style="padding:28px 0 0;">
      <div style="font-size:18px;color:#545E6B;font-family:var(--font);">End date</div>
      <div style="font-size:15px;color:#545E6B;margin-top:6px;padding-bottom:14px;font-family:var(--font);">${dfState.endDate}</div>
    </div>
    <div style="height:1px;background:rgba(0,0,0,0.12);"></div>
  `;

  return `
    <div style="height:8px;flex-shrink:0;"></div>
    <div style="flex:1;background:#fff;border-radius:12px 12px 0 0;display:flex;flex-direction:column;overflow:hidden;">

      <!-- Tabs -->
      <div style="display:flex;flex-shrink:0;border-bottom:1px solid rgba(0,0,0,0.09);">
        <div onclick="window._dfTab('month')" style="flex:1;text-align:center;padding:18px 0;font-size:18px;color:#545E6B;position:relative;cursor:pointer;font-family:var(--font);">
          Month
          ${!isCustom ? '<div style="position:absolute;bottom:0;left:0;right:0;height:2.5px;background:#1b87e6;border-radius:2px 2px 0 0;"></div>' : ''}
        </div>
        <div onclick="window._dfTab('custom')" style="flex:1;text-align:center;padding:18px 0;font-size:18px;color:#545E6B;position:relative;cursor:pointer;font-family:var(--font);">
          Custom
          ${isCustom ? '<div style="position:absolute;bottom:0;left:0;right:0;height:2.5px;background:#1b87e6;border-radius:2px 2px 0 0;"></div>' : ''}
        </div>
      </div>

      <!-- Content -->
      <div style="flex:1;overflow-y:auto;padding:0 16px;">
        ${isCustom ? customTabHTML : monthTabHTML}
      </div>

      <!-- Apply -->
      <button
        onclick="window._dfApply()"
        style="flex-shrink:0;background:#1b87e6;color:#fff;font-size:18px;font-family:var(--font);border:none;height:56px;cursor:pointer;font-weight:500;letter-spacing:0.2px;"
      >Apply</button>
    </div>
  `;
}

window._dfTab = function(tab) {
  dfState.tab = tab;
  const el = document.getElementById('df-overlay');
  if (el) el.innerHTML = renderDateFilter();
};

window._dfSelectMonth = function(opt) {
  dfState.selectedMonth = opt;
  const el = document.getElementById('df-overlay');
  if (el) el.innerHTML = renderDateFilter();
};

window._dfApply = function() {
  const label = dfState.tab === 'custom'
    ? dfState.startDate + ' - ' + dfState.endDate
    : dfState.selectedMonth;
  dashState.dateRange = label;
  const el = document.getElementById('dash-date-label');
  if (el) el.textContent = label;
  closeDateFilter();
};

/* ── Carousel dot sync ───────────────────── */
window.onCarouselScroll = function() {
  const el = document.getElementById('dash-carousel');
  if (!el) return;
  const idx = Math.round(el.scrollLeft / el.clientWidth);
  document.querySelectorAll('#dash-dots .dash-dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });
};

/* ── Segment callback ───────────────────── */
function onSegmentSelect(id, name) {
  dashState.segment = name;
  const el = document.getElementById('dash-segment-label');
  if (el) el.textContent = name;
  showToast('Segment: ' + name, 'info');
}

/* ── Init ───────────────────────────────── */
document.body.innerHTML = renderPhoneShell(renderDashboard(), 'dashboard');
</script>
</body>
